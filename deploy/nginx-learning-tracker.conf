# Nginx reverse proxy: http://IP/learning-tracker  ->  container Next.js (127.0.0.1:3000)
#
# Pasang di Droplet (host):
#   sudo cp deploy/nginx-learning-tracker.conf /etc/nginx/sites-available/learning-tracker
#   sudo ln -s /etc/nginx/sites-available/learning-tracker /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Container harus jalan & terikat ke localhost saja:
#   docker run -d --name learning-tracker --restart unless-stopped \
#     -p 127.0.0.1:3000:3000 -v lt-data:/app/data learning-tracker

server {
    listen 80;
    server_name _;            # cocok untuk akses via IP mentah

    # Root -> arahkan ke subpath app
    location = / {
        return 302 /learning-tracker;
    }

    # Reverse proxy ke container. TANPA trailing slash di proxy_pass:
    # URI /learning-tracker/... diteruskan apa adanya -> cocok dgn basePath Next.js.
    location /learning-tracker {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;          # dukung websocket
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
