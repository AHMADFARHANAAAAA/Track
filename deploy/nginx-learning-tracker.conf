# Nginx reverse proxy: https://<IP>.sslip.io/learning-tracker -> container Next.js (127.0.0.1:3000)
#
# Pasang di Droplet (host):
#   sudo cp deploy/nginx-learning-tracker.conf /etc/nginx/sites-available/learning-tracker
#   sudo ln -s /etc/nginx/sites-available/learning-tracker /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS (Jalur A: gratis & tepercaya tanpa beli domain) -- pakai nama sslip.io yang
# otomatis menunjuk ke IP, lalu Let's Encrypt via Certbot:
#   sudo ufw allow 443/tcp
#   sudo apt update && sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d 159.89.207.8.sslip.io     # pilih "redirect" saat ditanya
# Certbot akan otomatis menambahkan blok `listen 443 ssl` + sertifikat + redirect 80->443
# ke file ini. Cek perpanjangan otomatis: sudo certbot renew --dry-run
#
# Container harus jalan & terikat ke localhost saja:
#   docker run -d --name learning-tracker --restart unless-stopped \
#     -p 127.0.0.1:3000:3000 -v lt-data:/app/data learning-tracker

server {
    listen 80;
    # Nama host wajib cocok dgn -d Certbot. sslip.io: <IP>.sslip.io -> resolve ke IP itu.
    server_name 159.89.207.8.sslip.io;

    # Root -> arahkan ke subpath app
    location = / {
        return 302 /learning-tracker;
    }

    # Reverse proxy ke container. TANPA trailing slash di proxy_pass:
    # URI /learning-tracker/... diteruskan apa adanya -> cocok dgn basePath Next.js.
    location /learning-tracker {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;          # dukung websocket
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
